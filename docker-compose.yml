services:
  rain-api:
    build: .
    image: rain-batch-api:1.0.0
    container_name: rain-batch-api
    ports:
      - "8000:8000"
    environment:
      RAIN_DATA_DIR: /data
      RAIN_REAPER_INTERVAL: "5"
      RAIN_MAX_UPLOAD_BYTES: "52428800"
    volumes:
      - rain-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rain-data:
